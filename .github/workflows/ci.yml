name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned, and pinned HERE as well as in .python-version, because nothing else does:
      # `requires-python = ">=3.11"` lets uv resolve whatever the runner happens to ship.
      # A gate that runs a different interpreter locally than in CI produces failures nobody
      # can reproduce — CPython 3.13 changed gzip's header, which is how a committed corpus
      # became unrebuildable on CI while passing on a developer machine (ADR-0033).
      - run: uv python install 3.13
      - run: uv sync --frozen
      # scripts/check.sh is the single source of truth for what the Python gate is.
      - run: bash scripts/check.sh

  web:
    # The dashboard is the product UI — ~10k lines of TypeScript that no Python check can
    # see. CLAUDE.md claimed CI ran this gate; it did not, so every web change was landing
    # unverified. `npm run check` is typecheck + lint + vitest + build, the same command the
    # contributor runs, so the two cannot diverge.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
