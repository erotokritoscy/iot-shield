# Benchmark spec: all three meter detectors, under the engine this project ships. Read against
# bench/meter_fused.yaml: same detections, so any difference is the engine's alone.

source_format: sensipro-hourly-csv
normalizer: meter

detectors:
  - name: meter_iforest
  - name: meter_lof
  - name: meter_baseline

alert_engine:
  name: weighted
  params:
    # An hour, because this lane's events are hourly (see bench/meter.yaml).
    bucket_minutes: 60

# No `assets:`: asset_weight would be a number we typed in (ADR-0021 D7).
