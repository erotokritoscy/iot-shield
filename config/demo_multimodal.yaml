# Multi-modal demo — the payoff of multi-source ingestion (ADR-0019) now that the LOG lane
# has a detector (ADR-0020): ONE run ingests a telemetry CSV *and* a syslog stream for the
# SAME asset (pump-02), routes each to its own normalizer, pools the events into two lanes,
# and judges both. This is the first run in which cross-lane corroboration actually fires.
#
# What each lane contributes, in the same 5-minute alert bucket on pump-02:
#   - telemetry: the pressure spike (95.4, 101.9 kPa > 80) -> two point detections;
#   - log: three error/critical lines in 35s (trigger: 3) -> one collective detection,
#     score=3 vs threshold=2 (the exceedance boundary, min_count-1).
#
# The weighted engine correlates all three into ONE alert whose `corroboration` factor is
# 1.5 rather than 1.0 — two lanes agreeing about one asset, the first time that factor has
# ever exceeded 1. Its effect is the whole point: telemetry alone scored ~27 (LOW); the same
# pressure spike corroborated by the log burst scores ~56 (HIGH). The product's headline
# claim — anomalies correlated across modalities on one asset — is what this run executes.
#
# The severity_spike preset is used here (not auth_failure) because these are *device*
# errors, not authentication: it is the format-agnostic preset and needs no message
# patterns. See config/demo_log.yaml for the credential-attack story.

database_url: "sqlite:///demo.db"

sources:
  - normalizer: stub
    source_format: stub-csv
    path: data/demo/demo_multimodal.csv
  - normalizer: syslog
    source_format: syslog
    path: data/demo/demo_multimodal.log

detectors:
  - name: stub_threshold
    params:
      threshold: 80.0
      lane: telemetry
  - name: log_burst
    params:
      preset: severity_spike
      window_minutes: 5
      min_count: 3

alert_engine:
  name: weighted
  params:
    bucket_minutes: 5

assets:
  - asset_id: pump-02
    name: Feed pump 2
    asset_type: pump
    location: line-1
    criticality: high
