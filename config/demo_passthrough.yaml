# Pass-through demo — a source that already arrives normalized (ADR-0025).
#
# Not every source needs parsing. A partner SCADA system here already emits our canonical
# event shape as JSONL (one NormalizedEvent per line). iotshield does not re-parse it — the
# `passthrough` normalizer VALIDATES each record against the contract and ENVELOPES it,
# quarantining anything that fails. The trust boundary is identical to every other
# normalizer's; only the work is smaller. This is the smallest a working normalizer can be,
# which is why it is the contributor guide's hello-world.
#
# What the input exercises (data/demo/demo_passthrough.jsonl): 10 lines ->
#   - 7 good telemetry events. One (row 2) omits `source_type` entirely: the `lane` param
#     below fills it in. One (row 4) is written with a +02:00 offset and is normalized to
#     UTC at the contract boundary. Provenance is preserved: each event keeps its upstream
#     `source_format` of "partner-scada", distinct from the pipeline format that routed it.
#   - 3 quarantined lines, each a different failure the boundary must catch, never drop:
#       * a naive timestamp (the contract rejects timezone-naive datetimes),
#       * a record declaring `source_type: log` — the wrong lane for this telemetry source,
#       * a non-JSON checkpoint line the exporter left in the stream.
#     They show up on the dashboard's Data health page.
#
# The stub_threshold detector (telemetry, threshold 80) then flags the three pressure/flow
# spikes above 80 (rows 2, 4, 6). The two on the registered, high-criticality pump-07 fall
# in one time bucket and correlate into a single alert whose `volume` factor reflects the
# repeat; sensor-03 is auto-discovered (neutral criticality) and gets its own.
#
# The one design point worth noting: because a pass-through record carries its own lane in
# the data, which the static compatibility guard cannot see, the lane THIS source carries is
# declared as the `lane` param below. That keeps the guard's coverage check accurate — no
# false "lane has no detector" warnings — and lets the adapter quarantine a misrouted record.

database_url: "sqlite:///demo.db"

sources:
  - normalizer: passthrough
    source_format: normalized-jsonl
    path: data/demo/demo_passthrough.jsonl
    params:
      lane: telemetry

detectors:
  - name: stub_threshold
    params:
      threshold: 80
      lane: telemetry

alert_engine:
  name: weighted
  params:
    bucket_minutes: 5

assets:
  - asset_id: pump-07
    name: Line-2 booster pump
    asset_type: pump
    location: line-2
    criticality: high
