# Demo pipeline configuration — the module-selection surface (ADR-0006).
# Swapping a module = changing a name here; the runner never changes.

database_url: "sqlite:///demo.db"
source_format: stub-csv
normalizer: stub

detectors:
  - name: stub_threshold
    params:
      threshold: 80.0
      lane: telemetry

alert_engine:
  name: stub
  params:
    bucket_minutes: 5

# Seed registrations. gw-01 is deliberately absent: it gets auto-discovered
# from the data, demonstrating the registered-vs-discovered distinction.
assets:
  - asset_id: pump-02
    name: Feed pump 2
    asset_type: pump
    location: line-1
    criticality: high
  - asset_id: pump-03
    name: Feed pump 3
    asset_type: pump
    location: line-1
    criticality: medium
