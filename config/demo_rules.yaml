# Rule demo — the first alerts this product has ever produced that say WHAT they are.
#
# Every detector before ADR-0032 answers "is this unusual?" This one answers "is this a
# known-bad thing?", and the difference shows up twice: in what gets caught, and in what the
# analyst reads.
#
# WHAT GETS CAUGHT. `flow_burst:fan_out` is configured here and finds NOTHING — deliberately.
# The camera probes SIX hosts on telnet, well under fan-out's 20-distinct-peers boundary, and
# uploads 4.2 MB, well under exfiltration's 50 MB. Both are invisible to rate detection and
# both are obvious to a signature, because a camera dialling port 23 has no legitimate reason
# to do so even once. Waiting for twenty of them is waiting for confirmation of something
# already certain. That is the capability gap this adapter fills, made visible by a detector
# that stays silent next to it.
#
# WHAT THE ANALYST READS. Until now every alert this system produced ended with
# `threat_class: unknown` and a generated instruction that restated the alert. Here:
#
#   10.0.0.24  73.9  CRITICAL
#     threat class      : Remote Services (T1021)
#     recommended action: Isolate the device and inspect its firmware for compromise. Review
#                         which hosts it contacted on port 23 and whether any answered. [...]
#     rationale         : ... Threat class: Remote Services (T1021), per
#                         rule:telnet-outbound-propagation.
#
# MEASURED, and reproducible from these two files:
#   19 events, 0 malformed, 7 detections from 6 rules across 2 lanes, 2 alerts.
#   - the camera (10.0.0.24, criticality high) raises FOUR detections across TWO lanes —
#     telnet propagation and a 4.2 MB upload on flow, the sshd break-in warning and a
#     firmware-integrity CRITICAL on logs — so corroboration is 1.50 and volume 1.45:
#     priority 73.9, CRITICAL. The strongest single claim (telnet, high severity at medium
#     confidence -> margin 2.55) names the alert; the actions are UNIONED across the rules
#     that fired, which is why the analyst gets both the containment steps and the
#     "investigate the reverse DNS mismatch" step from a different rule entirely.
#   - the gateway (10.0.0.11, unregistered -> auto-discovered at medium) raises three
#     flow-lane detections: an SSH session dialled in from 203.0.113.9, an SMB conversation,
#     and — a genuine consequence of asset-relative accounting — the 41 kB the gateway sent
#     back DURING that SSH session, which is a real outbound transfer and trips the upload
#     rule. Priority 50.0, HIGH.
#
# THE ONE SUBTLETY WORTH READING THE FIELD LIST FOR. Flow fields are asset-relative
# (ADR-0023 D2), so a service port lands on `flow.peer_port` for a connection the device MADE
# and on `flow.asset_port` for one it RECEIVED. `telnet-outbound-propagation` addresses the
# first; `inbound-remote-admin` addresses the second. Written the other way round either rule
# reads perfectly and can never fire — the silent failure the checked vocabulary exists to
# prevent, and one its own author walked into while writing these two.
#
# Asset identity: flow records identify a device by IP, because that is the only identity a
# flow carries, so the syslog hostname here is the camera's IP. That is a legitimate (and
# common) deployment choice; reconciling hostname-keyed and IP-keyed identities in general
# needs the asset-aliasing layer we have deliberately NOT built (ADR-0023 Consequences).

database_url: "sqlite:///demo.db"

sources:
  - normalizer: flow
    source_format: zeek-conn
    path: data/demo/demo_rules_flow.log
  - normalizer: syslog
    source_format: syslog
    path: data/demo/demo_rules_syslog.log

detectors:
  # One adapter, one instance per lane, many rules per instance (ADR-0032 D3). The Detector
  # port gives a detector a single lane, so a rule set spanning network and logs is two
  # entries — NOT two adapters, and not one entry per rule, which would put every new rule
  # into every deployment's config and destroy the "adding a detection is dropping in a file"
  # promise. `ruleset` is unset, so both use the library packaged with the product.
  - name: rules
    params:
      lane: flow
  - name: rules
    params:
      lane: log
  # Configured on purpose and silent on purpose: see the note at the top.
  - name: flow_burst
    params:
      preset: fan_out

alert_engine:
  name: weighted
  params:
    bucket_minutes: 5

assets:
  - asset_id: 10.0.0.24
    name: Line-1 IP camera (cam-07)
    asset_type: camera
    location: line-1
    criticality: high
