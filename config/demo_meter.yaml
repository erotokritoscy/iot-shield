# Utility-meter demo (ADR-0030) — the metering lane, and the first scikit-learn model.
#
# ONE run ingests TWO different meter platforms and judges them with the SAME detector,
# which is the claim the metering integration exists to make: adding a client is a
# dialect, not a detector.
#
#   - eoa-meter-csv        : the EOA (Nicosia water) per-meter history export — 9 columns,
#                            rows written NEWEST-FIRST, naive Cyprus local time.
#   - sensipro-hourly-csv  : an export of SensiPro's `ascendinghourlyreading` rollup —
#                            water AND electricity from one table, so this is the source
#                            that exercises one detector serving both utilities.
#
# Both are cumulative counters. The `meter` normalizer differences them gap-safely into
# hourly consumption, carries the raw counter in metadata (so the boundary stays
# invertible and a rollback stays recoverable), and quarantines what it cannot read.
#
# What the run produces on data/demo/demo_meter.csv:
#   - 332 consumption events, 3 quarantined rows (a non-numeric counter, an unparseable
#     timestamp, a truncated row) — captured, never dropped (ADR-0004);
#   - a 2-hour transmission gap that yields NO events, because hourly consumption across
#     a gap is genuinely unknown and inventing it is the "gap-boundary false spike" the
#     upstream project documents;
#   - ONE detection: a continuous overnight draw at ~2x the evening peak, held for three
#     hours (local 03:00-05:00 = 00:00-02:00 UTC) — a burst pipe's signature on an hourly
#     meter. score 0.7994 vs the threshold 0.7513 LEARNED on ten weeks of this meter's own
#     clean history at a budget of ~1 false alarm per meter-month.
#
# The evidence is the point: `deviation` at z=25.4 ("consumption far above the usual level
# for this hour of the week"). That is the case a magnitude threshold cannot catch — the
# volume is ordinary for an evening, and extraordinary for 3am — and it is why the
# hour-of-week profile is the feature that carries this detector.
#
# The SensiPro meters have no fitted model in the committed artifact, so they are SKIPPED
# rather than scored against another meter's normal. That is deliberate and is what the
# per-meter design means: `meter_iforest` fits one model per meter (a fleet of 1,656 needs
# 1,656 fits, done at deployment), so the demo artifact covers the demo meter only. Their
# events still flow, are still stored, and still appear on the dashboard.
#
# Provenance: both demo files are SYNTHETIC, generated in the real wire formats and
# calibrated to the real per-meter statistics published in the upstream project's
# committed data-quality report (consumption_mean ~0.008 m3/h, max ~0.135, ~50% idle
# hours). The device ids are deliberately not real meters. See ADR-0030 D7.

database_url: "sqlite:///demo.db"

sources:
  - normalizer: meter
    source_format: eoa-meter-csv
    path: data/demo/demo_meter.csv
  - normalizer: meter
    source_format: sensipro-hourly-csv
    path: data/demo/demo_meter_sensipro.csv

detectors:
  - name: meter_iforest
    params:
      artifact: demo_meter

alert_engine:
  name: weighted
  params:
    bucket_minutes: 60

assets:
  - asset_id: "202405109001"
    name: Water meter 202405109001
    asset_type: water-meter
    location: nicosia-district-3
    criticality: medium
  - asset_id: SP-4471
    name: SensiPro water meter 4471
    asset_type: water-meter
    location: sensipro-premises-a
    criticality: low
  - asset_id: SP-9302
    name: SensiPro electricity meter 9302
    asset_type: electricity-meter
    location: sensipro-premises-a
    criticality: low
