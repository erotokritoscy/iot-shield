# File-only run: no Postgres, no dashboard — results captured losslessly to JSONL.
# Demonstrates the pluggable result store (ADR-0018, framing B): the SAME pipeline as
# config/demo.yaml, only the destination differs. There is no `database_url` because no
# sink needs a database. Run:
#   python -m iotshield.pipeline --input data/demo/demo.csv --config config/demo_file.yaml
# then inspect the JSONL it appends — one self-contained record (metadata + all payload
# arrays) per run, which any downstream tool can ingest.

source_format: stub-csv
normalizer: stub

detectors:
  - name: stub_threshold
    params:
      threshold: 80.0
      lane: telemetry

alert_engine:
  name: weighted

# The single point of difference from config/demo.yaml: results go to a file, not a DB.
sinks:
  - name: file
    params:
      path: iotshield-results.jsonl

assets:
  - asset_id: pump-02
    name: Feed pump 2
    asset_type: pump
    location: line-1
    criticality: high
