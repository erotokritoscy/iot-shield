# Triage demo — the payoff of the whole pipeline: TWO detectors feeding the
# explainable `weighted` alert engine over a multi-asset plant. Unlike the
# single-alert demos, this shows PRIORITIZATION as a *ranking* you can read.
#
# Two detectors run side by side (the runner routes each by lane):
#   - team3_zscore  -> owns skab-testbed (the only asset with all 8 SKAB channels)
#   - stub_threshold-> fires on any telemetry value > 300. SKAB's largest channel
#                      (Voltage ~255) stays under 300, so the two detectors never
#                      overlap: team3 flags the real fault, stub flags the pumps.
#
# The dataset is engineered so the weighted engine's three single-lane factors are
# each visible in the ranked queue (see data/demo/demo_triage.csv header):
#   1. severity  -> skab-testbed's real anomaly saturates the severity factor -> #1.
#   2. asset_weight -> reactor-pump (CRITICAL) and utility-pump (LOW) have the
#      IDENTICAL 750 kPa breach, yet reactor ranks HIGH and utility MEDIUM: the
#      engine prioritizes the asset, not just the signal.
#   3. volume    -> boiler-pump's readings are only mildly over the alarm, but it
#      trips 5x in one window -> the volume factor escalates persistence.

database_url: "sqlite:///demo.db"
source_format: stub-csv
normalizer: stub

detectors:
  - name: team3_zscore
    params:
      artifact: skab_zscore
  - name: stub_threshold
    params:
      threshold: 300.0
      lane: telemetry

alert_engine:
  name: weighted
  params:
    bucket_minutes: 5

assets:
  - asset_id: skab-testbed
    name: SKAB rotor testbed
    asset_type: pump
    location: skab-rig
    criticality: high
  - asset_id: reactor-pump
    name: Reactor coolant pump
    asset_type: pump
    location: line-1
    criticality: critical
  - asset_id: utility-pump
    name: Utility water pump
    asset_type: pump
    location: line-2
    criticality: low
  - asset_id: boiler-pump
    name: Boiler feed pump
    asset_type: pump
    location: line-1
    criticality: medium
