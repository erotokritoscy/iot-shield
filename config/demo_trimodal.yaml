# Tri-modal demo — all THREE lanes judging one asset in one run, for the first time.
#
# ADR-0019 made a run carry several sources; ADR-0020 gave the LOG lane a judge and got the
# weighted engine's `corroboration` factor off 1.0 for the first time (to 1.5, two lanes);
# ADR-0023/0024 add the FLOW lane. The factor is 1 + 0.5 x (lanes - 1), so three agreeing
# lanes on one asset make it 2.0 — the ceiling of what the current engine can express, and
# the product's headline claim executed end to end.
#
# One compromised IP camera (10.0.0.24), one five-minute window, three independent stories:
#   - FLOW      : 43 distinct destinations in a minute, mostly unanswered telnet -> Mirai-
#                 shaped propagation (flow_burst:fan_out, score 43 vs boundary 20).
#   - LOG       : a failed firmware integrity check, a blocked outbound connection and a
#                 watchdog critical, three error+ lines in 35s (log_burst:severity_spike).
#   - TELEMETRY : the sensor board runs hot while the malware works (91.7, 104.2 > 80).
#
# Each alone is arguable. A device that is simultaneously scanning the internet, failing its
# own firmware check and running hot is not. That is what corroboration is for, and it is
# why detector depth had to come before cross-lane correlation: fusing weak signals would
# only manufacture confident noise.
#
# Measured, and the whole point of the run: the identical flow sweep scores 44.1 (MEDIUM)
# on its own in demo_flow.yaml, and 76.4 (CRITICAL) here — 4 detections across 3 lanes,
# corroboration 2.00, volume 1.45. Same evidence, different confidence, because three
# independent modalities agree about one device inside one five-minute window.
#
# Note the asset identity. Flow records identify a device by IP — that is the only identity
# a flow carries — so for the three lanes to correlate, all three sources must agree on it.
# Here the syslog hostname and the telemetry asset id are the camera's IP, which is a
# legitimate (and common) deployment choice. Reconciling hostname-keyed and IP-keyed
# identities in general needs an asset-aliasing layer we have deliberately NOT built yet;
# see ADR-0023 Consequences.

database_url: "sqlite:///demo.db"

sources:
  - normalizer: stub
    source_format: stub-csv
    path: data/demo/demo_trimodal.csv
  - normalizer: syslog
    source_format: syslog
    path: data/demo/demo_trimodal.log
  - normalizer: flow
    source_format: zeek-conn
    path: data/demo/demo_flow.log

detectors:
  - name: stub_threshold
    params:
      threshold: 80.0
      lane: telemetry
  - name: log_burst
    params:
      preset: severity_spike
      window_minutes: 5
      min_count: 3
  - name: flow_burst
    params:
      preset: fan_out

alert_engine:
  name: weighted
  params:
    bucket_minutes: 5

assets:
  - asset_id: 10.0.0.24
    name: Line-1 IP camera (cam-07)
    asset_type: camera
    location: line-1
    criticality: high
