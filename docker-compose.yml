# Full-compose MVP: Postgres + a one-shot schema init + both APIs + the
# dashboard, plus the pipeline runner as an on-demand job (profile "jobs").
#
#   docker compose up                 # postgres -> init -> APIs -> dashboard
#   docker compose run --rm runner    # populate the DB with the walkthrough (config/demo.yaml)
#
# Login is ON in this stack (IOTSHIELD_AUTH, ADR-0039): open :8080, register an organization,
# and the walkthrough's data goes into it by naming its id (shown on the Account page):
#   IOTSHIELD_DEMO_ORG=acme-water docker compose run --rm runner
#
# The platform's super admin (ADR-0040) is created from the server, never the website. The
# init step SEEDS the "UCY" organization, a super admin at home in it (admin@admin.com /
# password unless overridden below) and the walkthrough's data into it — each only once, so
# change that password on the Account page. More super admins, by hand:
#   docker compose run --rm runner python -m iotshield.auth.superadmin create --username root
# IOTSHIELD_OPEN_REGISTRATION=0 docker compose up -d   closes public registration.
#
# The dashboard is the React SPA on :8080 (`dashboard-web`), a pure client of
# the same two APIs. The Streamlit app it replaced (ADR-0031) has been removed.
#
# Services address each other by service name on the default network: the API
# and runner reach Postgres at host `postgres`, the dashboard reaches the API at
# host `api`. Credentials come from .env (see .env.example); the defaults below
# make the stack run out of the box for local use.
#
# Every published port binds to 127.0.0.1, not 0.0.0.0. ADR-0007's Consequences say the read
# API "must not be exposed beyond the compose network in this form", and :8100 is the WRITE
# plane — it triggers pipeline runs with no authentication at all. Binding to loopback keeps
# the stack reachable from the developer's own browser, which is its whole purpose, without
# offering it to the network the laptop happens to be on. Publish wider only behind
# something that authenticates.
name: iotshield

# The same image for every app service; each overrides `command`. The shared
# `image` tag makes compose build and export it once, not once per service.
x-app: &app
  build: .
  image: iotshield-app

# The DB URL, assembled from the Postgres credentials, injected via env so
# load_config / the services pick it up (12-factor). `postgres` is the hostname.
x-db-env: &db-env
  IOTSHIELD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-iotshield}:${POSTGRES_PASSWORD:-iotshield}@postgres:5432/${POSTGRES_DB:-iotshield}

# Login and per-organization data (ADR-0039), on both APIs: each enforces it itself, because a
# login page in front of an open API protects nothing. Off when unset (host runs, tests).
x-auth-env: &auth-env
  IOTSHIELD_AUTH: "1"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iotshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iotshield}
      POSTGRES_DB: ${POSTGRES_DB:-iotshield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "container started" != "accepting connections"; gate dependents on this.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iotshield} -d ${POSTGRES_DB:-iotshield}"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    <<: *app
    # Schema first, then the seed (create-only: anything that already exists is left alone).
    command: ["sh", "-c", "python -m iotshield.storage.init && python -m iotshield.auth.seed"]
    environment:
      <<: *db-env
      # A LOCAL-DEVELOPMENT default with well-known credentials — acceptable only because every
      # port binds to 127.0.0.1. Override both in .env (or set them empty to seed nothing) for
      # any stack another person can reach.
      IOTSHIELD_SEED_SUPERADMIN_USERNAME: ${IOTSHIELD_SEED_SUPERADMIN_USERNAME-admin@admin.com}
      IOTSHIELD_SEED_SUPERADMIN_PASSWORD: ${IOTSHIELD_SEED_SUPERADMIN_PASSWORD-password}
      # The super admin's home organization (its id is the slug, "ucy"), and the walkthrough
      # loaded into it while it has no events. Empty either to skip that step.
      IOTSHIELD_SEED_ORGANIZATION: ${IOTSHIELD_SEED_ORGANIZATION-UCY}
      IOTSHIELD_SEED_DEMO_CONFIG: ${IOTSHIELD_SEED_DEMO_CONFIG-config/demo.yaml}
      # The demo config names a rule-detector shelf; same value the runner states.
      IOTSHIELD_RULES_PATH: "/app/config/rules"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["python", "-m", "iotshield.api"]
    environment:
      <<: [*db-env, *auth-env]
      IOTSHIELD_API_HOST: "0.0.0.0"  # bind all interfaces, not container loopback
      IOTSHIELD_API_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # Write-side Pipeline API (ADR-0015): compose a pipeline and trigger runs. A
  # separate role from the read API so the read plane stays write-free and
  # independently scalable, and a slow/crashing run can't take the read side down.
  pipeline-api:
    <<: *app
    command: ["python", "-m", "iotshield.api.control"]
    environment:
      <<: [*db-env, *auth-env]
      IOTSHIELD_PIPELINE_API_HOST: "0.0.0.0"  # bind all interfaces, not container loopback
      # Whether anyone may register an organization (ADR-0040). On by default; set it to 0 in
      # the shell or .env and only the super admin can create organizations.
      IOTSHIELD_OPEN_REGISTRATION: ${IOTSHIELD_OPEN_REGISTRATION:-1}
      IOTSHIELD_PIPELINE_API_PORT: "8100"
      # File-sink output dir (ADR-0018): bind-mounted to the host below, so a file-sink
      # run's JSONL is visible on the host and survives container recreation. A
      # caller-supplied filename is confined to this dir (sink/file.py).
      IOTSHIELD_OUTPUT_DIR: "/app/results"
      # The evaluation plane (ADR-0021). This compose stack IS the research/dev stack, so
      # it opts in; the default when unset stays off, which is what a product image gets.
      # Without it the /eval routes are never registered — absent, not merely guarded.
      IOTSHIELD_EVAL_API: "1"
      # Corpora live here. The image carries only the committed `synthetic` bundle —
      # datasets we may use but not redistribute are kept out of it (ADR-0021 D5a) — so
      # the host's data/eval is bind-mounted read-only on top, making anything a developer
      # fetched locally (`iotshield.eval fetch skab`) visible to the API without ever
      # baking it into a shippable artifact.
      IOTSHIELD_CORPUS_PATH: "/app/data/eval"
      # The rule shelf (ADR-0037): where a DEPLOYMENT's own detection rules live, as opposed
      # to the library packaged inside the product. Bind-mounted read-only below, so adding a
      # rule set is creating a directory on the host — no rebuild, no restart, and it shows up
      # in the dashboard's `ruleset` dropdown on the next page load. Config names a rule set
      # and never a path, so this variable is the only thing that decides which directories a
      # run can read rules from.
      IOTSHIELD_RULES_PATH: "/app/config/rules"
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./results:/app/results
      - ./data/eval:/app/data/eval:ro
      - ./config/rules:/app/config/rules:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # The dashboard (ADR-0031): the product's three planes as a single-page app served by
  # nginx, which also reverse-proxies /api and /pipeline so the browser makes only
  # same-origin requests — which is what keeps both FastAPI apps free of CORS, the stance
  # they deliberately take. It needs no eval flag of its own: it *probes* /eval/corpora and
  # hides the Evaluate mode when the router is absent, so IOTSHIELD_EVAL_API alone decides
  # that plane end to end (ADR-0031 D5).
  dashboard-web:
    build:
      context: ./web
    image: iotshield-web
    environment:
      # Proxy targets, not frontend config: the bundle only ever calls relative paths.
      IOTSHIELD_API_URL: http://api:8000
      IOTSHIELD_PIPELINE_API_URL: http://pipeline-api:8100
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
      pipeline-api:
        condition: service_healthy

  # Batch job, not a service: runs once and exits. Profile-gated so `up` never
  # starts it; invoke on demand with `docker compose run --rm runner ...`.
  runner:
    <<: *app
    profiles: ["jobs"]
    command:
      - python
      - -m
      - iotshield.pipeline
      # config/demo.yaml carries its own source paths, so no --input. Override the whole
      # command to point the runner at other data (the service has no entrypoint).
      - --config=config/demo.yaml
      # Which organization the results belong to (ADR-0039). The runner is a trusted writer
      # with direct DB access, so it takes the id as given (creating the org if absent) —
      # name the one you registered, or the data lands in an org nobody can log into.
      - --org=${IOTSHIELD_DEMO_ORG:-default}
    environment:
      <<: *db-env
      # Stated rather than left to the repo-shaped default. The default would in fact resolve
      # correctly here (`uv sync` installs the project editable, so /app/src/iotshield/... makes
      # REPO_ROOT /app) — but a rule shelf that silently comes back empty is indistinguishable
      # from one that is merely unused, so the shelf a run may read is named on purpose.
      IOTSHIELD_RULES_PATH: "/app/config/rules"
    depends_on:
      init:
        condition: service_completed_successfully
    # Bind-mount inputs/config so you can point the runner at new data without a
    # rebuild; IOTSHIELD_DATABASE_URL still overrides the file's SQLite default.
    volumes:
      - ./data:/app/data
      - ./config:/app/config

volumes:
  pgdata:
