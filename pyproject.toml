[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iotshield"
dynamic = ["version"]
description = "iotshield.ai modular detection pipeline MVP (CYENS internship, July 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iotshield"]

[tool.hatch.version]
path = "src/iotshield/__init__.py"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
